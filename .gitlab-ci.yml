check_server_environment:
  script:
    - echo "系统版本:" && uname -a
    - echo "CPU 信息:" && lscpu
    - echo "内存信息:" && free -h
    - echo "磁盘信息:" && df -h
    - echo "网络信息:" && ip a
    - echo "当前时间:" && date
    - |
      if command -v docker &> /dev/null
      then
        echo "Docker 版本:" && docker --version
      else
        echo "Docker 未安装"
      fi
  tags:
    - localhost