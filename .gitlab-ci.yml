stages:
  - pre
  - build
  - deploy

variables:
  NODE_VERSION: "18.18.0" # Node.js 版本
  DIST_DIR: "dist"       # 构建输出目录
  DEPLOY_PATH: "/var/www/norman.log.monitor.web" # 部署目标路径

# 使用带有 docker 和 localhost 标签的 Runner
default:
  tags:
    - docker
    - localhost

# Pre阶段: 环境准备工作
pre:
  stage: pre
  image: node:${NODE_VERSION}
  script:
    - sudo chmod +x pre_init_docker.sh
    - sudo ./pre_init_docker.sh
# Build阶段: 项目依赖安装并构建
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
  - >
    echo "开始 Build 阶段: 安装依赖并构建项目..." &&
    sudo docker run --rm -v $(pwd):/app -w /app node:${NODE_VERSION} /bin/bash -c "
    npm install &&
    npm run build &&
    echo 'Build 完成: 构建产物已生成在 ${DIST_DIR} 目录'"
# Deploy阶段: 部署构建的文件
deploy:
  stage: deploy
  image: node:${NODE_VERSION}
  script:
    - >
      echo "开始 Deploy 阶段: 部署到主机 ${DEPLOY_PATH}..." &&
      ls ${DIST_DIR} && cp -r ${DIST_DIR}/* ${DEPLOY_PATH} &&
      echo "Deploy 阶段完成: 文件已部署到 ${DEPLOY_PATH}"
