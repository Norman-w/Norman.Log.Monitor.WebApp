stages:
  - build
  - deploy

variables:
  NODE_VERSION: "18.18.0" # Node.js 版本
  DIST_DIR: "dist"       # 构建输出目录
  DEPLOY_PATH: "/var/www/norman.log.monitor.web" # 部署目标路径

# 使用带有 docker 和 localhost 标签的 Runner
default:
  tags:
    - docker
    - localhost
# Build阶段: 项目依赖安装并构建
build:
  stage: build
  script:
    - echo "开始 Build 阶段. 安装依赖并构建项目..."
    - npm install
    - npm run build
    - DIST_ABS_PATH=$(realpath ${DIST_DIR})
    - echo "Build 完成, 构建产物已生成在 ${DIST_ABS_PATH} 目录"
# Deploy阶段: 部署构建的文件
deploy:
  stage: deploy
  image: node:${NODE_VERSION}
  script:
    - >
      echo "开始 Deploy 阶段: 部署到主机 ${DEPLOY_PATH}..." &&
      DIST_ABS_PATH=$(realpath}) &&
      echo "开始 Deploy 阶段: 将文件复制到 ${DEPLOY_PATH}..." &&
      echo "源路径: ${DIST_ABS_PATH}, 部署目标路径: ${DEPLOY_PATH}" &&
      ls ${DIST_ABS_PATH} &&
      cp -r ${DIST_ABS_PATH}/* ${DEPLOY_PATH} &&
      DEPLOY_TIME=$(date "+%Y-%m-%d %H:%M:%S") &&
      echo "Deploy 阶段完成: 文件已部署到 ${DEPLOY_PATH}" &&
      echo "部署完成时间: ${DEPLOY_TIME}" &&
      echo "详细日志见以上输出"
